name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PARTIZAN_REF: 739c99be4a974f81682e23e5f921d61850032a5a
  PARTIZAN_BASE_PATH: /partizan-reproducibility

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reproducibility materials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout the frozen Partizan visualizer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: devinnicholson/partizan
          ref: ${{ env.PARTIZAN_REF }}
          path: _partizan
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _partizan/visualizer/package-lock.json
      - name: Install the frozen visualizer
        working-directory: _partizan/visualizer
        run: npm ci
      - name: Build for the repository Pages path
        working-directory: _partizan/visualizer
        env:
          NEXT_PUBLIC_PARTIZAN_BASE_PATH: ${{ env.PARTIZAN_BASE_PATH }}
          PARTIZAN_ASSET_BASE: ${{ env.PARTIZAN_BASE_PATH }}/
          PARTIZAN_PUBLIC_ORIGIN: https://devinnicholson.github.io
        run: npm run build
      - name: Render and verify the static site
        env:
          NEXT_PUBLIC_PARTIZAN_BASE_PATH: ${{ env.PARTIZAN_BASE_PATH }}
          PARTIZAN_PUBLIC_ORIGIN: https://devinnicholson.github.io
        run: node site/render-static.mjs _partizan/visualizer _site
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
