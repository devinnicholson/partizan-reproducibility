name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3"
      - name: Compile research tools
        run: python -m compileall -q scripts/research
      - name: Run lightweight checks
        env:
          PYTHONPATH: scripts/research
        run: |
          python -m unittest \
            scripts/research/test_validate_digraph_order7_diversity_policy_protocol_v3.py \
            scripts/research/test_fixed_value_descriptor_atlas_v1.py \
            scripts/research/test_stage_and_verify_digraph_order7_diversity_policy_v3.py
